name: build-firma-provenance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/elvinisem/demo-sigstore
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
      - name: Firmar imagen (keyless con identidad del workflow)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
      - name: Generar provenance SLSA
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
